[project]
name = "Project_1"
version = "0.1.0"
description = "Press Release Sentiment Tracker"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "flask>=2.0",
    "SQLAlchemy>=2.0",
    "flask-sqlalchemy>=3.1",
    "flask-migrate>=4.0",
    "psycopg[binary]>=3.1",
    "python-dotenv>=1.0",
    "boto3>=1.34"
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"